name: Daily Blog Automation

on:
  schedule:
    # 8:00 AM IST is 2:30 AM UTC
    - cron: "30 2 * * *"
    # 10:00 PM IST is 4:30 PM UTC
    - cron: "30 16 * * *"
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Automation Script
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
        run: python main.py
